# ModCheck regression cases for IndustrialControlSystems.
# Generated by Tests/Scripts/generate_modcheck_cases.py -- edit the script, not this file,
# unless a case needs a hand-tuned override (then note it in the case comment).
# References: ReferenceResults/ beside this file (ModCheck's --ref-dir default).
#   store:  run_regression.sh --config <this file> --store
#   check:  run_regression.sh --config <this file>
# rtol is the model's experiment Tolerance / 100 (the checking run loosens it 100x).
library: IndustrialControlSystems
workspace: industrialcontrol
custom_function: dynamic
tolerance: 1.0e-3
timeout_seconds: 600

cases:
  - name: Applications_ControlProblems_ATProcessControl
    # 10 library component(s), first 6 recorded
    # hand-set: relay-autotuned R_iD settles at CS ~ -1.2e-3 while its range is 3.3: the default endpoint band (1e-3 x |endpoint|) is ~1e-6 wide; 5e-2 is 6e-5 absolute
    enabled: true
    model: IndustrialControlSystems.Applications.ControlProblems.ATProcessControl
    start_time: 0.0
    final_time: 500.0
    ncp: 5000
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, R_FO.CS, R_FOD.CS, R_i.CS, R_iD.CS, R_OS.CS, R_US.CS]
    variable_tolerances: {"R_iD.CS": 5.0e-2}

  - name: Applications_ControlProblems_CascadeAntiWindup
    # 8 library component(s), first 6 recorded
    enabled: true
    model: IndustrialControlSystems.Applications.ControlProblems.CascadeAntiWindup
    start_time: 0.0
    final_time: 50.0
    ncp: 500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, PID_outer_extLock.CS, PID_inner_extLock.CS, PID_outer.CS, PID_inner.CS, P1.y, P2.y]

  - name: Applications_ControlProblems_CascadeControl
    # 7 library component(s), first 6 recorded
    enabled: true
    model: IndustrialControlSystems.Applications.ControlProblems.CascadeControl
    start_time: 0.0
    final_time: 90.0
    ncp: 500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, R.CS, R_outer.CS, R_inner.CS, P1.y, P2.y, P_inner.y]

  - name: Applications_ControlProblems_DecoupledControl_NoDecoupledControl
    # 2 library component(s)
    enabled: true
    model: IndustrialControlSystems.Applications.ControlProblems.DecoupledControl.NoDecoupledControl
    start_time: 0.0
    final_time: 50.0
    ncp: 500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, controller1.CS, controller2.CS]

  - name: Applications_ControlProblems_PI_ContinuousVsDigital
    # 6 library component(s)
    enabled: true
    model: IndustrialControlSystems.Applications.ControlProblems.PI_ContinuousVsDigital
    start_time: 0.0
    final_time: 50.0
    ncp: 500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, R_disc.CS, R_cont.CS, R_dig.CS, P_disc.y, P_cont.y, P_dig.y]

  - name: Applications_ControlProblems_ProcessControl
    # 10 library component(s), first 6 recorded
    enabled: true
    model: IndustrialControlSystems.Applications.ControlProblems.ProcessControl
    start_time: 0.0
    final_time: 40.0
    ncp: 500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, R_FO.CS, R_FOD.CS, R_i.CS, R_iD.CS, R_OS.CS, R_US.CS]

  - name: Applications_ControlStrategies_LeadLagFilter
    # 3 library component(s)
    enabled: true
    model: IndustrialControlSystems.Applications.ControlStrategies.LeadLagFilter
    start_time: 0.0
    final_time: 120.0
    ncp: 500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, sensor.y, lowPassFilter.y, leadLagFilter.y]

  - name: Applications_ProcessControl_CascadeLevelControl
    # 4 library component(s)
    enabled: true
    model: IndustrialControlSystems.Applications.ProcessControl.CascadeLevelControl
    start_time: 0.0
    final_time: 4500.0
    ncp: 500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, PI_Level.CS, PI_Valve.CS, div.y, sub.y]

  - name: Applications_ProcessControl_LevelControl
    # 3 library component(s)
    # hand-set: sampled PI (Ts = 5) in a limit cycle at CSmin: a tiny solver difference shifts the 0.1-high pulse train by exactly one sample (same pulses, different phase), so CS is checked by its signed integral (total valve opening), which the shift leaves unchanged
    enabled: true
    model: IndustrialControlSystems.Applications.ProcessControl.LevelControl
    start_time: 0.0
    final_time: 4500.0
    ncp: 500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, PI_Level.CS, div.y, sub.y]
    integral_signed_variables: [PI_Level.CS]
    integral_tolerance: 3.0e-3   # band 4.9 on int|CS|dt = 1637; measured 1.01 (~2 pulses)

  - name: Applications_ProcessControl_VelocityDriveControl_AutoTuning
    # 2 library component(s)
    enabled: true
    model: IndustrialControlSystems.Applications.ProcessControl.VelocityDriveControl_AutoTuning
    start_time: 0.0
    final_time: 12.0
    ncp: 500
    rtol: 1.0e-8
    modifiers: {}
    variables: [time, ATPIdigital.CS, noiseGen.y]
